[pytest]
testpaths = tests
addopts = -q -p no:cacheprovider
markers =
    mail: testes fim a fim que usam SMTP/IMAP reais (caixa de testes)
    live: testes que acessam a internet (fontes reais, OpenRouter, Cybersec-1M)
    perf: carga com volume de 1 ano (lento)
filterwarnings =
    ignore::DeprecationWarning
