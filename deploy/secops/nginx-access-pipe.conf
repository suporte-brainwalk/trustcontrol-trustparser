# Google SecOps (Chronicle) — parser personalizado (CBN) para o access log do Nginx no formato delimitado por " | ".
# Gerado pelo Trust Parser a partir do parser "nginx-access-pipe" (validado em 3.306 linhas reais com 100% de cobertura).
# Formato esperado (a linha pode vir com ou sem o carimbo ISO do coletor e com ou sem cabeçalho syslog):
#   2026-10-05T11:38:35.575Z 05/Oct/2026:08:38:35 -0300 | 203.0.113.7 | - | "api.exemplo.com.br" | "GET /contas/1 HTTP/1.1" | 200 | 1103 |
#   "-" | "IOS-APP" | "198.51.100.20, 203.0.113.7" | SSLVerify: "NONE" - 200 | SSL_DN: "-" | - - - "TLSv1.3/TLS_AES_256_GCM_SHA384" - "-"
# Saída: UDM NETWORK_HTTP (principal = cliente real do X-Forwarded-For; intermediary = IP que entregou ao Nginx; target = host/URL).
# Antes de enviar: no SecOps use "Validate"/"Preview" com algumas linhas reais.
filter {
  mutate {
    replace => {
      "collector_ts" => ""
      "time_local" => ""
      "remote_addr" => ""
      "remote_user" => ""
      "host" => ""
      "request" => ""
      "status" => ""
      "bytes" => ""
      "referer" => ""
      "user_agent" => ""
      "xff" => ""
      "ssl_verify" => ""
      "upstream_status" => ""
      "tail" => ""
      "method" => ""
      "uri" => ""
      "protocol" => ""
      "client_ip" => ""
      "tls_version" => ""
      "tls_cipher" => ""
    }
  }

  grok {
    match => {
      "message" => [
        "(?:%{TIMESTAMP_ISO8601:collector_ts}\\s+)?(?P<time_local>\\d{2}/[A-Za-z]{3}/\\d{4}:\\d{2}:\\d{2}:\\d{2} [+-]\\d{4}) \\| %{IP:remote_addr} \\| %{DATA:remote_user} \\| \"%{DATA:host}\" \\| \"%{DATA:request}\" \\| %{INT:status} \\| %{INT:bytes} \\| \"%{DATA:referer}\" \\| \"%{DATA:user_agent}\" \\| \"%{DATA:xff}\" \\| SSLVerify: \"%{DATA:ssl_verify}\" \\S* %{DATA:upstream_status} \\| SSL_DN: \"%{DATA:ssl_dn}\" \\| %{GREEDYDATA:tail}"
      ]
    }
    overwrite => ["collector_ts", "time_local", "remote_addr", "remote_user", "host", "request", "status", "bytes", "referer", "user_agent", "xff", "ssl_verify", "upstream_status", "tail"]
    on_error => "grok_failed"
  }

  if [grok_failed] {
    drop { tag => "TAG_MALFORMED_MESSAGE" }
  }

  date {
    match => ["time_local", "dd/MMM/yyyy:HH:mm:ss Z"]
    target => "event.idm.read_only_udm.metadata.event_timestamp"
    on_error => "date_failed"
  }

  grok {
    match => { "request" => "^%{WORD:method} %{NOTSPACE:uri}(?: %{NOTSPACE:protocol})?$" }
    overwrite => ["method", "uri", "protocol"]
    on_error => "request_failed"
  }

  grok {
    match => { "xff" => "^\\s*%{IP:client_ip}" }
    overwrite => ["client_ip"]
    on_error => "xff_failed"
  }

  grok {
    match => { "tail" => "\"(?P<tls_version>(?:TLS|SSL)v[\\d.]+)/(?P<tls_cipher>[^\"]+)\"" }
    overwrite => ["tls_version", "tls_cipher"]
    on_error => "tls_failed"
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
      "event.idm.read_only_udm.metadata.vendor_name" => "NGINX"
      "event.idm.read_only_udm.metadata.product_name" => "NGINX"
      "event.idm.read_only_udm.metadata.product_event_type" => "%{status}"
      "event.idm.read_only_udm.network.ip_protocol" => "TCP"
      "event.idm.read_only_udm.target.hostname" => "%{host}"
    }
  }

  if [tls_version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol" => "HTTPS"
        "event.idm.read_only_udm.network.tls.version" => "%{tls_version}"
        "event.idm.read_only_udm.network.tls.cipher" => "%{tls_cipher}"
        "event.idm.read_only_udm.target.url" => "https://%{host}%{uri}"
      }
    }
  } else {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol" => "HTTP"
        "event.idm.read_only_udm.target.url" => "http://%{host}%{uri}"
      }
    }
  }

  if [method] != "" {
    mutate { replace => { "event.idm.read_only_udm.network.http.method" => "%{method}" } }
  }
  if [user_agent] != "" and [user_agent] != "-" {
    mutate { replace => { "event.idm.read_only_udm.network.http.user_agent" => "%{user_agent}" } }
  }
  if [referer] != "" and [referer] != "-" {
    mutate { replace => { "event.idm.read_only_udm.network.http.referral_url" => "%{referer}" } }
  }
  if [remote_user] != "" and [remote_user] != "-" {
    mutate { replace => { "event.idm.read_only_udm.principal.user.userid" => "%{remote_user}" } }
  }

  mutate { convert => { "status" => "integer" } on_error => "status_failed" }
  if ![status_failed] {
    mutate { rename => { "status" => "event.idm.read_only_udm.network.http.response_code" } }
  }
  mutate { convert => { "bytes" => "uinteger" } on_error => "bytes_failed" }
  if ![bytes_failed] {
    mutate { rename => { "bytes" => "event.idm.read_only_udm.network.received_bytes" } }
  }

  # cliente real: primeiro IP do X-Forwarded-For; sem XFF, o IP que conectou no Nginx
  if [client_ip] != "" {
    mutate { merge => { "event.idm.read_only_udm.principal.ip" => "client_ip" } }
    mutate { merge => { "intermediary_noun.ip" => "remote_addr" } }
    mutate { merge => { "event.idm.read_only_udm.intermediary" => "intermediary_noun" } }
  } else {
    mutate { merge => { "event.idm.read_only_udm.principal.ip" => "remote_addr" } }
  }

  if [ssl_verify] != "" {
    mutate { replace => { "label_verify.key" => "ssl_client_verify" "label_verify.value.string_value" => "%{ssl_verify}" } }
    mutate { merge => { "event.idm.read_only_udm.additional.fields" => "label_verify" } }
  }
  if [upstream_status] != "" and [upstream_status] != "-" {
    mutate { replace => { "label_up.key" => "upstream_status" "label_up.value.string_value" => "%{upstream_status}" } }
    mutate { merge => { "event.idm.read_only_udm.additional.fields" => "label_up" } }
  }

  mutate { merge => { "@output" => "event" } }
}
