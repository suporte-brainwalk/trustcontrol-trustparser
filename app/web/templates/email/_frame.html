<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>{{ subject|default('Trust Parser') }}</title></head>
<body style="margin:0;padding:0;background:#eef3f8;font-family:Calibri,Arial,sans-serif;color:#1f2d3d;">
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;"><tr><td align="center" style="padding:14px 8px;">
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:820px;border-collapse:collapse;background:#ffffff;border:1px solid #d7e0ea;border-radius:8px;overflow:hidden;">
  <tr><td style="padding:16px 20px;background:#10140c;border-bottom:4px solid #9dcd17;"><img src="cid:tplogo" height="22" alt="Trust Control" style="display:inline-block;height:22px;border:0;vertical-align:middle;"><span style="color:#9dcd17;font-family:Roboto,Arial,sans-serif;font-weight:700;font-size:16px;margin-left:12px;vertical-align:middle;">Trust Parser</span></td></tr>
  {% block body %}{% endblock %}
  <tr><td style="padding:12px 20px 16px 20px;background:#f8fafc;border-top:1px solid #e3eaf2;font-size:11px;color:#7a8794;line-height:1.5;">{% block footer %}Trust Parser · Trust Control. Mensagem automática — não responda.{% endblock %}</td></tr>
</table></td></tr></table>
</body></html>
