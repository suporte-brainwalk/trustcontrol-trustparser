# Proxy de saída do sandbox da EVA: SOMENTE openrouter.ai (HTTPS via CONNECT). Todo o resto é negado.
http_port 3128
acl openrouter dstdomain openrouter.ai
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny !SSL_ports
http_access deny !CONNECT
http_access allow CONNECT openrouter
http_access deny all
cache deny all
access_log daemon:/var/log/squid/access.log
